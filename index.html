<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZO Portfolio | Photography Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <div class="background-canvas" id="bg-canvas"></div>
    <main class="dashboard">
        <header class="header">
            <h1 class="logo">OZO<span>.WORK1</span></h1>
            <p class="tagline">Photography & Virtual Tours</p>
        </header>
        
        <div id="viewer-container" style="display: none; width: 100%; height: 60vh; margin-top: 20px; border-radius: 20px; overflow: hidden; position: relative;">
            <div id="panorama" style="width: 100%; height: 100%;"></div>
            <button onclick="closeViewer()" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.5); color: white; border: none; padding: 10px 15px; border-radius: 50%; cursor: pointer;">✕</button>
        </div>

        <section id="gallery" class="portal-grid">
            <!-- Project cards will be injected here -->
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
